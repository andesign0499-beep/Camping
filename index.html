<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Merge Camping Game</title>
    <link rel="icon" type="image/png" href="assets/images_webp/ui/icon_map.webp">
    <link rel="preload" as="image" href="assets/images_webp/ui/splash.jpg" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=11.33">
</head>
<body>
    <div id="game-app">
        <!-- MÀN HÌNH SPLASH VIDEO KHI TẢI GAME -->
        <div id="splash-screen" class="splash-screen" role="status" aria-live="polite" style="position:absolute;inset:0;z-index:99999;background:#2b3d27;">
            <img class="splash-bg-img" src="assets/images_webp/ui/splash.jpg" alt="My Camp Trip" fetchpriority="high" decoding="sync">
            <video id="splash-video" class="splash-bg-video" autoplay muted playsinline preload="auto" poster="assets/images_webp/ui/splash.jpg" aria-hidden="true">
                <source src="assets/images_webp/ui/splash.mp4" type="video/mp4">
            </video>
            <div class="splash-bottom-shade" aria-hidden="true"></div>
            <div class="splash-loader-wrap">
                <div class="splash-progress-track">
                    <div id="splash-progress-fill" class="splash-progress-fill" style="width: 8%;"></div>
                </div>
                <div id="splash-progress-label" class="splash-progress-label">Đang tải khu trại... 8%</div>
            </div>
        </div>
        <script>
            (function () {
                var splash = document.getElementById('splash-screen');
                var video = document.getElementById('splash-video');
                var fill = document.getElementById('splash-progress-fill');
                var label = document.getElementById('splash-progress-label');
                if (!splash || !fill || !label) return;

                var startTime = Date.now();
                var FALLBACK_SHOW_MS = 2500;
                var HOLD_LAST_FRAME_MS = 1000;
                var SKIP_AFTER_MS = 1200;
                var MAX_WAIT_MS = 12000;
                var progress = 8;
                var target = 20;
                var pageLoaded = false;
                var videoPlaying = false;
                var videoEnded = false;
                var videoFailed = !video;
                var dismissed = false;

                if (video) {
                    video.addEventListener('playing', function () {
                        videoPlaying = true;
                        video.classList.add('is-ready');
                    }, { once: true });
                    video.addEventListener('ended', function () {
                        videoEnded = true;
                        try { video.pause(); } catch (e) {}
                    });
                    video.addEventListener('error', function () {
                        videoFailed = true;
                    });
                    video.addEventListener('canplay', function () {
                        var p = video.play();
                        if (p && typeof p.catch === 'function') {
                            p.catch(function () { videoFailed = true; });
                        }
                    }, { once: true });
                    var initPlay = video.play();
                    if (initPlay && typeof initPlay.catch === 'function') {
                        initPlay.catch(function () {});
                    }
                }

                function getLoadingPrefix() {
                    try {
                        var savedLang = localStorage.getItem('merge_camping_lang');
                        if (savedLang && savedLang.toLowerCase().indexOf('en') === 0) {
                            return 'Loading camp...';
                        }
                    } catch (e) {}
                    return 'Đang tải khu trại...';
                }

                var prefix = getLoadingPrefix();

                function renderProgress(val) {
                    var pct = Math.max(0, Math.min(100, Math.round(val)));
                    fill.style.width = pct + '%';
                    label.textContent = prefix + ' ' + pct + '%';
                }

                function cleanupVideo() {
                    if (!video) return;
                    try {
                        video.pause();
                        video.removeAttribute('src');
                        while (video.firstChild) video.removeChild(video.firstChild);
                        video.load();
                    } catch (e) {}
                }

                function dismissSplash(immediate) {
                    if (dismissed) return;
                    dismissed = true;
                    renderProgress(100);
                    if (video) {
                        try { video.pause(); } catch (e) {}
                    }
                    var holdMs = immediate ? 120 : HOLD_LAST_FRAME_MS;
                    setTimeout(function () {
                        splash.classList.add('is-hiding');
                        setTimeout(function () {
                            cleanupVideo();
                            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                        }, 520);
                    }, holdMs);
                }

                // Cho phép chạm để bỏ qua nhanh sau khi game đã tải xong & xem tối thiểu 1.2s
                splash.addEventListener('pointerdown', function () {
                    if (pageLoaded && (Date.now() - startTime) >= SKIP_AFTER_MS) {
                        dismissSplash(true);
                    }
                });

                function tick() {
                    if (dismissed) return;
                    var elapsed = Date.now() - startTime;

                    if (video && videoPlaying && video.duration && isFinite(video.duration) && video.duration > 0) {
                        var videoRatio = Math.min(1, video.currentTime / video.duration);
                        target = videoEnded ? 100 : Math.max(12, Math.min(99, 10 + videoRatio * 89));
                    } else if (videoFailed) {
                        target = pageLoaded
                            ? Math.min(100, 15 + (elapsed / FALLBACK_SHOW_MS) * 85)
                            : Math.min(85, 15 + (elapsed / FALLBACK_SHOW_MS) * 70);
                    } else {
                        // Video đang buffer khung đầu tiên
                        target = Math.min(25, 8 + (elapsed / 1500) * 17);
                    }

                    progress += (target - progress) * (videoEnded ? 0.35 : 0.16);
                    renderProgress(progress);

                    var readyToDismiss = (videoEnded && pageLoaded)
                        || (videoFailed && pageLoaded && elapsed >= FALLBACK_SHOW_MS);

                    if (readyToDismiss && progress >= 98.5) {
                        dismissSplash(false);
                        return;
                    }
                    if (elapsed >= MAX_WAIT_MS) {
                        dismissSplash(false);
                        return;
                    }
                    requestAnimationFrame(tick);
                }

                document.addEventListener('DOMContentLoaded', function () {
                    target = Math.max(target, 62);
                });

                window.addEventListener('load', function () {
                    pageLoaded = true;
                });

                requestAnimationFrame(tick);
            })();
        </script>
        <!-- NỀN LIỀN MẠCH TOÀN MÀN HÌNH: ĐÓNG GÓI BG_GAME_ALL (100% COVER) + 4 ĐÁM MÂY BAY + HÒN ĐẢO CẮM TRẠI -->
        <div id="game-backdrop" class="game-backdrop" aria-hidden="true">
            <div class="backdrop-sky"></div>
            <div class="backdrop-clouds" id="backdrop-clouds">
                <img data-src="assets/images_webp/ui/bg_all_may1.webp" class="backdrop-cloud cloud-1" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may2.webp" class="backdrop-cloud cloud-2" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may3.webp" class="backdrop-cloud cloud-3" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may4.webp" class="backdrop-cloud cloud-4" alt="">
            </div>
            <div class="backdrop-island" id="backdrop-island"></div>
        </div>

        <!-- PHẦN TRÊN: CẢNH CẮM TRẠI (CO GIÃN THEO MÀN HÌNH), THANH HUD, NHÂN VẬT & ĐƠN HÀNG -->
        <section id="top-scene">
            <!-- MÂY BAY MÀN CHƠI (ẨN ĐỂ ƯU TIÊN MÂY HOÀNG HÔN NỀN TRỜI MỚI) -->
            <div id="top-scene-clouds" class="top-scene-clouds" style="display:none;" aria-hidden="true"></div>

            <!-- HEADER: Bản đồ, Năng lượng, Vàng, Kim cương & Cài đặt -->
            <header id="game-header">
                <button id="btn-world-map" class="hud-icon-btn map-hud-btn" title="Mở Bản Đồ Hành Trình">
                    <img src="assets/images_webp/ui/icon_map.webp" alt="Bản đồ">
                    <span id="current-lv-badge" class="lv-map-badge"><span class="lv-map-num">1</span></span>
                </button>

                <div class="hud-stats-group">
                    <div class="hud-stat-banner energy-banner" id="btn-refill-energy" title="Bấm để mở Trạm Tiếp Năng Lượng">
                        <div class="energy-icon-wrapper">
                            <img class="hud-stat-icon" src="assets/images_webp/ui/icon_nangluong.webp" alt="Năng lượng">
                            <div class="sparkle-star star-1"></div>
                            <div class="sparkle-star star-2"></div>
                            <div class="sparkle-star star-3"></div>
                        </div>
                        <span id="energy-val" class="hud-stat-val">100</span>
                        <img class="hud-add-btn" src="assets/images_webp/ui/icon_add.webp" alt="+">
                    </div>

                    <div class="hud-stat-banner gold-banner" id="btn-coin-shop" title="Vàng tích lũy (Nhận khi ghép đồ, nộp đơn & qua màn)">
                        <img class="hud-stat-icon" src="assets/images_webp/ui/icon_glod.webp" alt="Vàng">
                        <span id="coin-val" class="hud-stat-val">100</span>
                        <img class="hud-add-btn" src="assets/images_webp/ui/icon_add.webp" alt="+">
                    </div>

                    <div class="hud-stat-banner ruby-banner" id="btn-gem-shop" title="Kim cương (Nhận khi qua màn, ghép Lv.8 & Cẩm Nang)">
                        <img class="hud-stat-icon" src="assets/images_webp/ui/icon_ruby.webp" alt="Kim cương">
                        <span id="gem-val" class="hud-stat-val">20</span>
                        <img class="hud-add-btn" src="assets/images_webp/ui/icon_add.webp" alt="+">
                    </div>
                </div>

                <button id="btn-settings" class="hud-icon-btn setting-hud-btn" title="Cài đặt trò chơi">
                    <img src="assets/images_webp/ui/icon_setting.webp" alt="Cài đặt">
                </button>
            </header>

            <!-- KHU VỰC NHÂN VẬT ĐỒNG HÀNH, HỘP THOẠI & ĐƠN HÀNG (GẮN SÁT TRÊN KHUNG BÀN CỜ) -->
            <div id="scene-stage">
                <!-- ĐÁM MÂY BAY CHẬM DƯỚI ẢNH GÒ CỎ (LOAD SAU CÙNG) -->
                <div id="npc-stage-cloud" class="npc-stage-cloud" aria-hidden="true">
                    <img data-src="assets/images_webp/background/may1.webp" class="npc-stage-cloud-img" alt="">
                </div>

                <div id="npc-guide-wrap" class="npc-guide-wrap">
                    <button id="npc-avatar-btn" class="npc-character-btn" title="Chạm vào nhân vật để trò chuyện & xem gợi ý">
                        <img id="npc-avatar-img" class="npc-character-img" src="assets/images_webp/ui/character01.webp" alt="Nhân vật đồng hành">
                    </button>
                </div>

                <div id="scene-right-column">
                    <div id="npc-speech-bubble" class="npc-speech-bubble" style="display:none" title="Chạm để đóng hoặc xem gợi ý">
                        <div class="talk-bg-3slice" aria-hidden="true">
                            <div class="t3-left"></div>
                            <div class="t3-mid"></div>
                            <div class="t3-right"></div>
                        </div>
                        <div id="npc-speech-text" class="npc-speech-text"></div>
                    </div>
                    <div id="orders-container"></div>
                </div>

                <!-- RƯƠNG SAO ĐẶT GỌN Ở GÓC PHẢI CẢNH (KHÔNG CHỮ ĐẾM, ĐẦY SAO SẼ RUNG LÊN) -->
                <div class="scene-right-tools" id="scene-right-tools">
                    <button id="btn-star-chest" class="scene-tool-btn star-chest-tool-btn" type="button" title="Tích Sao từ đơn hàng để mở Rương Sao">
                        <img id="star-chest-icon" src="assets/images_webp/ui/icon_ruongdong.webp" class="scene-tool-icon" alt="Rương Sao">
                    </button>
                </div>
            </div>
        </section>

        <!-- PHẦN DƯỚI: KHUNG BÀN CỜ 7x9 & 4 NÚT CHỨC NĂNG GỌN GÀNG -->
        <section id="bottom-play-area">
            <main class="board-container">
                <div class="board-frame-wrapper">
                    <!-- DẢI BỤI CỎ TRANG TRÍ 2 BÊN TRÁI & PHẢI BÀN CHƠI (TỰ NHIÊN, XẾP CHÉO NHAU & ĐÈ LÊN MÉP BÀN 8PX) -->
                    <div class="board-bushes board-bushes-left" aria-hidden="true">
                        <img src="assets/images_webp/board/glass1.webp" class="board-bush bush-top" alt="">
                        <img src="assets/images_webp/board/glass2.webp" class="board-bush bush-mid" alt="">
                        <img src="assets/images_webp/board/glass3.webp" class="board-bush bush-bot" alt="">
                    </div>
                    <div class="board-bushes board-bushes-right" aria-hidden="true">
                        <img src="assets/images_webp/board/glass2.webp" class="board-bush bush-top" alt="">
                        <img src="assets/images_webp/board/glass3.webp" class="board-bush bush-mid" alt="">
                        <img src="assets/images_webp/board/glass1.webp" class="board-bush bush-bot" alt="">
                    </div>
                    <div id="grid-board"></div>
                </div>
            </main>

            <footer id="game-footer">
                <!-- NÚT BÁN VẬT PHẨM: ĐẶT GIỮA BÀN CHƠI PHÍA TRÊN FOOTER -->
                <button id="btn-sell" class="btn-3s btn-green board-sell-btn" type="button" style="display: none;" title="Bán vật phẩm đang chọn">
                    <span class="btn-3s-bg" aria-hidden="true">
                        <span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span>
                    </span>
                    <span class="btn-3s-text" id="sell-btn-text">Bán</span>
                </button>

                <button id="btn-camp" class="footer-img-btn btn-camp-ui" type="button" title="Cửa Hàng">
                    <img src="assets/images_webp/ui/icon_shop.webp" class="footer-btn-icon" alt="Cửa hàng">
                    <span class="footer-btn-label">Cửa hàng</span>
                </button>
                <button id="btn-storage" class="footer-img-btn btn-storage-ui" type="button" title="Kho Lưu Trữ Tạm (4 ô): Kéo đồ vào hoặc bấm để cất/lấy đồ">
                    <img src="assets/images_webp/ui/icon_box.webp" class="footer-btn-icon" alt="Kho đồ">
                    <span class="footer-btn-label">Kho đồ <span id="storage-count-label">0/4</span></span>
                </button>
                <button id="btn-book" class="footer-img-btn btn-book-ui" type="button" title="Cẩm Nang Trò Chơi">
                    <img src="assets/images_webp/ui/icon_book.webp" class="footer-btn-icon" alt="Khám phá">
                    <span class="footer-btn-label">Khám phá</span>
                </button>
                <button id="btn-my-camp" class="footer-img-btn btn-mycamp-ui" type="button" title="Xem trại">
                    <img src="assets/images_webp/ui/icon_trai.webp" class="footer-btn-icon" alt="Xem trại">
                    <span class="footer-btn-label">Xem trại</span>
                </button>
            </footer>
        </section>

        <!-- MÀN HÌNH TRẠI CỦA BẠN (MY CAMP SCREEN) -->
        <div id="my-camp-screen" class="my-camp-screen" style="display: none;">
            <!-- MÂY BAY NỀN HOÀNG HÔN CHO KHU TRẠI (PHÍA SAU ĐẢO) -->
            <div class="backdrop-clouds mycamp-clouds" aria-hidden="true">
                <img data-src="assets/images_webp/ui/bg_all_may1.webp" class="backdrop-cloud cloud-1" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may2.webp" class="backdrop-cloud cloud-2" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may3.webp" class="backdrop-cloud cloud-3" alt="">
                <img data-src="assets/images_webp/ui/bg_all_may4.webp" class="backdrop-cloud cloud-4" alt="">
            </div>

            <!-- VIEWPORT KÉO (PAN) & ZOOM KHÔNG GIAN BÃI TRẠI -->
            <div id="mycamp-viewport" class="mycamp-viewport">
                <!-- SÂN KHẤU CẮM TRẠI: CHỨA CẢ ẢNH NỀN VÀ CÁC ITEM CÙNG TỌA ĐỘ CỐ ĐỊNH -->
                <div id="mycamp-stage" class="mycamp-stage">
                    <img id="mycamp-bg-img" class="mycamp-bg-img" src="assets/images_webp/items_khutrai/bg_khutrai.jpg" alt="Khu trại">
                    <div class="mycamp-grid-overlay" id="mycamp-grid-overlay"></div>
                    <div id="mycamp-items-container" class="mycamp-items-container"></div>
                </div>
            </div>

            <!-- LỚP GRADIENT OVERLAY ĐÈ LÊN 20% PHÍA DƯỚI HÒN ĐẢO (POINTER-EVENTS: NONE) -->
            <div id="mycamp-gradient-overlay" class="mycamp-gradient-overlay"></div>

            <div class="mycamp-header">
                <div class="mycamp-title">Trại của bạn</div>
            </div>

            <!-- CỤM NÚT ĐÁY MÀN HÌNH "TRẠI CỦA BẠN": CHƠI TIẾP (CAM) & ĐỒ CẮM TRẠI (XANH) -->
            <div class="mycamp-bottom-actions">
                <button id="btn-mycamp-play" class="btn-3s btn-orange size-44 mycamp-bottom-btn mycamp-play-btn" type="button" title="Quay lại bàn chơi">
                    <span class="btn-3s-bg" aria-hidden="true"><span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span></span>
                    <span class="btn-3s-text">Chơi tiếp</span>
                </button>
                <button id="btn-mycamp-decor" class="btn-3s btn-green size-44 mycamp-bottom-btn mycamp-decor-btn" type="button" title="Đồ cắm trại">
                    <span class="btn-3s-bg" aria-hidden="true"><span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span></span>
                    <span class="btn-3s-text">Đồ cắm trại</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Google Firebase SDK (Compat Version cho Web tĩnh) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <!-- Bộ thư viện mã nguồn mở: Đồ họa WebGL (PixiJS + Filters + Particles) & Hoạt ảnh Juiciness (GSAP) -->
    <script src="js/libs/pixi.min.js"></script>
    <script src="js/libs/pixi-filters.js"></script>
    <script src="js/libs/particle-emitter.min.js"></script>
    <script src="js/libs/gsap.min.js"></script>
    <script src="js/libs/MotionPathPlugin.min.js"></script>

    <script src="js/i18n.js?v=11.31"></script>
    <script src="js/config.js?v=11.31"></script>
    <script src="js/data.js?v=11.31"></script>
    <script src="js/engine.js?v=11.31"></script>
    <script src="js/progress.js?v=11.31"></script>
    <script src="js/firebase-sync.js?v=11.31"></script>
    <script src="js/mycamp_config.js?v=11.31"></script>
    <script src="js/visual_fx.js?v=11.31"></script>
    <script src="js/camp.js?v=11.31"></script>
    <script src="js/components/board.js?v=11.31"></script>
    <script src="js/test_tool.js?v=11.31"></script>
    <script>
        // Tải 4 đám mây nền sau cùng (sau khi toàn bộ ảnh nền, giao diện & script đã tải xong)
        window.addEventListener('load', function () {
            setTimeout(function () {
                var clouds = document.querySelectorAll('.backdrop-cloud[data-src]');
                for (var i = 0; i < clouds.length; i++) {
                    var el = clouds[i];
                    var src = el.getAttribute('data-src');
                    if (src) {
                        el.setAttribute('src', src);
                        el.removeAttribute('data-src');
                    }
                }
            }, 150);
        });
    </script>
</body>
</html>
