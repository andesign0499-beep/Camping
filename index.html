<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Merge Camping Game</title>
    <link rel="icon" type="image/png" href="assets/images/ui/icon_map.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2.4">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="game-app">
        <!-- PHẦN TRÊN: CẢNH CẮM TRẠI (CO GIÃN THEO MÀN HÌNH), THANH HUD, NHÂN VẬT & ĐƠN HÀNG -->
        <section id="top-scene">
            <!-- HEADER: Bản đồ, Năng lượng, Vàng, Kim cương & Cài đặt -->
            <header id="game-header">
                <button id="btn-world-map" class="hud-icon-btn map-hud-btn" title="Mở Bản Đồ Hành Trình">
                    <img src="assets/images/ui/icon_map.png" alt="Bản đồ">
                    <span id="current-lv-badge" class="lv-map-badge"><span class="lv-map-num">1</span></span>
                </button>

                <div class="hud-stats-group">
                    <div class="hud-stat-banner energy-banner" id="btn-refill-energy" title="Bấm để mở Trạm Tiếp Năng Lượng">
                        <div class="energy-icon-wrapper">
                            <img class="hud-stat-icon" src="assets/images/ui/icon_nangluong.png" alt="Năng lượng">
                            <div class="sparkle-star star-1"></div>
                            <div class="sparkle-star star-2"></div>
                            <div class="sparkle-star star-3"></div>
                        </div>
                        <span id="energy-val" class="hud-stat-val">100</span>
                        <img class="hud-add-btn" src="assets/images/ui/icon_add.png" alt="+">
                    </div>

                    <div class="hud-stat-banner gold-banner" id="btn-coin-shop" title="Vàng tích lũy (Nhận khi ghép đồ, nộp đơn & qua màn)">
                        <img class="hud-stat-icon" src="assets/images/ui/icon_glod.png" alt="Vàng">
                        <span id="coin-val" class="hud-stat-val">100</span>
                        <img class="hud-add-btn" src="assets/images/ui/icon_add.png" alt="+">
                    </div>

                    <div class="hud-stat-banner ruby-banner" id="btn-gem-shop" title="Kim cương (Nhận khi qua màn, ghép Lv.8 & Cẩm Nang)">
                        <img class="hud-stat-icon" src="assets/images/ui/icon_ruby.png" alt="Kim cương">
                        <span id="gem-val" class="hud-stat-val">20</span>
                        <img class="hud-add-btn" src="assets/images/ui/icon_add.png" alt="+">
                    </div>
                </div>

                <button id="btn-settings" class="hud-icon-btn setting-hud-btn" title="Cài đặt trò chơi">
                    <img src="assets/images/ui/icon_setting.png" alt="Cài đặt">
                </button>
            </header>

            <!-- KHU VỰC NHÂN VẬT ĐỒNG HÀNH, HỘP THOẠI & ĐƠN HÀNG (GẮN SÁT TRÊN KHUNG BÀN CỜ) -->
            <div id="scene-stage">
                <div id="npc-guide-wrap" class="npc-guide-wrap">
                    <button id="npc-avatar-btn" class="npc-character-btn" title="Chạm vào nhân vật để trò chuyện & xem gợi ý">
                        <img id="npc-avatar-img" class="npc-character-img" src="assets/images/ui/character01.png" alt="Nhân vật đồng hành">
                    </button>
                </div>

                <div id="scene-right-column">
                    <div id="npc-speech-bubble" class="npc-speech-bubble" style="display:none" title="Chạm để đóng hoặc xem gợi ý">
                        <div class="talk-bg-3slice" aria-hidden="true">
                            <div class="t3-left"></div>
                            <div class="t3-mid"></div>
                            <div class="t3-right"></div>
                        </div>
                        <div id="npc-speech-text" class="npc-speech-text"></div>
                    </div>
                    <div id="orders-container"></div>
                </div>

                <!-- NÚT DỌN DẸP BÀN CỜ (CÂY CHỔI DỌN DẸP) -->
                <button id="btn-tidy-board" class="btn-tidy-board" title="Dọn dẹp bàn cờ: Bán vật phẩm thừa & gom nhóm gọn gàng (-3 Năng lượng)">
                    <img src="assets/images/ui/icon_clear.png" alt="Dọn dẹp" class="tidy-broom-img">
                    <img src="assets/images/board/icon_nangluong_tao.png" alt="Năng lượng" class="tidy-energy-badge">
                </button>
            </div>
        </section>

        <!-- PHẦN DƯỚI: KHUNG BÀN CỜ 7x9 & 3 NÚT CHỨC NĂNG -->
        <section id="bottom-play-area">
            <div id="wood-bar" class="wood-bar-wrap" aria-hidden="true">
                <img src="assets/images/ui/thanhgo.png" alt="" class="wood-bar-img">
            </div>
            <main class="board-container">
                <div class="board-frame-wrapper">
                    <div id="grid-board"></div>
                    <img src="assets/images/board/stroke_board.png" class="board-stroke-overlay" alt="" aria-hidden="true">
                </div>
            </main>

            <footer id="game-footer">
                <button id="btn-camp" class="footer-img-btn btn-camp-ui size-44" type="button" title="Khu Cắm Trại">
                    <span class="btn-3s-bg" aria-hidden="true"><span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span></span>
                    <span class="footer-btn-label">KHU TRẠI</span>
                </button>
                <button id="btn-book" class="footer-img-btn btn-book-ui size-44" type="button" title="Cẩm Nang Trò Chơi">
                    <span class="btn-3s-bg" aria-hidden="true"><span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span></span>
                    <span class="footer-btn-label">CẨM NANG</span>
                </button>
                <button id="btn-sell" class="footer-img-btn btn-sell-ui disabled size-44" type="button" title="Bán Vật Phẩm Lấy Vàng">
                    <span class="btn-3s-bg" aria-hidden="true"><span class="b3-left"></span><span class="b3-mid"></span><span class="b3-right"></span></span>
                    <span class="footer-btn-label"><span id="sell-btn-text">BÁN</span></span>
                </button>
            </footer>
        </section>
    </div>

    <!-- Google Firebase SDK (Compat Version cho Web tĩnh) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/firebase-sync.js"></script>
    <script src="js/camp.js"></script>
    <script src="js/components/board.js"></script>
</body>
</html>
